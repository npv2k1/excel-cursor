name: Create Release Candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Validate tag and create draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag matches package version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$package_version" || {
            echo "Tag $TAG_NAME does not match package.json version v$package_version" >&2
            exit 1
          }

      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test:ci
          pnpm run build
          pnpm audit --prod --audit-level high

      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(npm pack --ignore-scripts --json | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
          npm publish --dry-run --ignore-scripts

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.pack.outputs.package_file }}
